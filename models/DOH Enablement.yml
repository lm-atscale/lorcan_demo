unique_name: DOH Enablement
object_type: model
label: DOH Enablement
metrics:
  - unique_name: Overall Sales
  - unique_name: Sales Amount
  - unique_name: Order Quantity
  - unique_name: Average Unit Price
relationships:
  - unique_name: factinternetsales_orderdatekey_to_Date Dimension_Date
    from:
      dataset: factinternetsales
      join_columns:
        - orderdatekey
    role_play: Order {0}
    to:
      dimension: Date Dimension
      level: Date
  - unique_name: factinternetsales_shipdatekey_to_Date Dimension_Date
    from:
      dataset: factinternetsales
      join_columns:
        - shipdatekey
    role_play: Ship {0}
    to:
      dimension: Date Dimension
      level: Date
  - unique_name: factinternetsales_productkey_to_Product Dimension_Product Name
    from:
      dataset: factinternetsales
      join_columns:
        - productkey
    to:
      dimension: Product Dimension
      level: Product Name
